<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DraftKings League Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
    header { background: #333; color: white; padding: 20px; text-align: center; }
    main { padding: 20px; }
    select { padding: 10px; font-size: 16px; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background-color: #eee; }
    canvas { max-width: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>DraftKings League Tracker</h1>
  </header>

  <main>
    <label for="tournamentSelect">Select Tournament:</label>
    <select id="tournamentSelect"></select>
    <div id="content"></div>
  </main>

  <script>
    // Tabs including Season Standings + tournaments
    const tabs = [
      {name: 'Season Standings', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Season Standings'},
      {name: 'Pebble Beach', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Pebble Beach'},
      {name: 'Genesis', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Genesis'},
      {name: 'Arnold Palmer', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Arnold Palmer'},
      {name: 'The Players', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/The Players'},
      {name: 'Masters', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Masters'},
      {name: 'RBC Heritage', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/RBC Heritage'},
      {name: 'Miami Championship', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Miami Championship'},
      {name: 'Truist', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Truist'},
      {name: 'PGA Championship', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/PGA Championship'},
      {name: 'Memorial', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Memorial'},
      {name: 'US Open', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/US Open'},
      {name: 'Travelers', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Travelers'},
      {name: 'Open Championship', url: 'https://opensheet.elk.sh/1FFfF4GoYs4jPAchnh92aUWuPzTDA-0d10pun0NOpX-U/Open Championship'}
    ];

    const select = document.getElementById('tournamentSelect');
    const contentContainer = document.getElementById('content');

    // Populate dropdown
    tabs.forEach(tab => {
      const option = document.createElement('option');
      option.value = tab.url;
      option.textContent = tab.name;
      select.appendChild(option);
    });

    // Load selected tournament
    select.addEventListener('change', () => {
      const selectedTab = tabs.find(t => t.url === select.value);
      loadTab(selectedTab);
    });

    function loadTab(tab) {
      contentContainer.innerHTML = '<p>Loading...</p>';
      fetch(tab.url)
        .then(res => res.json())
        .then(data => {

  if(tab.name !== 'Season Standings'){
    data.sort((a,b) => Number(b['DK Points']) - Number(a['DK Points']));
  }

  if(tab.name === 'Season Standings') {
    renderTable(data);
    renderSeasonStandingsChart();
  } else {
    renderTable(data);
    renderTournamentChart(data, tab.name);
  }
})

        .catch(err => contentContainer.innerHTML = '<p>Error loading data</p>');
    }

    function renderTable(data) {
      if(!data || data.length === 0){ contentContainer.innerHTML = '<p>No data yet.</p>'; return; }
      let html = '<table><thead><tr>';
      Object.keys(data[0]).forEach(col => html += `<th>${col}</th>`);
      html += '</tr></thead><tbody>';
      data.forEach(row => {
        html += '<tr>' + Object.values(row).map(val => `<td>${val}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table>';
      contentContainer.innerHTML = html;
    }

    function renderTournamentChart(data, name) {
      if(!data || data.length === 0) return;
      const labels = data.map(d => d['Name']);
      const pointsKey = Object.keys(data[0]).find(k => k.toLowerCase().includes('points')) || Object.keys(data[0])[2];
      const points = data.map(d => parseFloat(d[pointsKey]) || 0);
      const canvas = document.createElement('canvas');
      contentContainer.appendChild(canvas);
      new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: `${name} Points`, data: points, backgroundColor: 'rgba(0,170,255,0.6)' }] },
        options: { scales: { y: { beginAtZero: true } } }
      });
    }

    function renderSeasonStandingsChart() {
      const tournamentTabs = tabs.slice(1);
      const players = [];
      const datasets = [];
      const promises = tournamentTabs.map(t => fetch(t.url).then(res => res.json()));

      Promise.all(promises).then(allData => {
        allData.forEach(data => {
          data.forEach(row => { if(!players.includes(row['Name'])) players.push(row['Name']); });
        });

        tournamentTabs.forEach((tab, i) => {
          const data = allData[i];
          const points = players.map(p => {
            const row = data.find(r => r['Name'] === p);
            const pointsKey = Object.keys(row || {}).find(k => k.toLowerCase().includes('points'));
            return row ? parseFloat(row[pointsKey]) || 0 : 0;
          });
          datasets.push({ label: tab.name, data: points, backgroundColor: `hsl(${i*25}, 70%, 50%)` });
        });

        const canvas = document.createElement('canvas');
        contentContainer.appendChild(canvas);
        new Chart(canvas.getContext('2d'), {
          type: 'bar',
          data: { labels: players, datasets: datasets },
          options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { legend: { position: 'top' } } }
        });
      });
    }

    // Load default view
    select.value = tabs[0].url;
    loadTab(tabs[0]);
  </script>
</body>
</html>
