<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DraftKings Golf League</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1, h2 {
    text-align: center;
}

select {
    padding: 8px;
    font-size: 16px;
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

th {
    background: #f2f2f2;
}
</style>
</head>
<body>

<h1>DraftKings Golf League</h1>

<h2>Season Standings</h2>
<table id="seasonTable"></table>

<h2>Tournaments</h2>
<select id="tournamentSelect"></select>
<table id="tournamentTable"></table>

<script>
const SHEET_ID = "YOUR_SHEET_ID";

const events = [
"Pebble Beach",
"Genesis",
"Arnold Palmer",
"The Players",
"Masters",
"RBC Heritage",
"Miami Championship",
"Truist",
"PGA Championship",
"Memorial",
"US Open",
"Travelers",
"Open Championship"
];

function sheetURL(sheet){
    return `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(sheet)}`;
}

async function loadSeasonStandings(){
    const res = await fetch(sheetURL("Season Standings"));
    const data = await res.json();

    let html = `<tr>
        <th>Place</th>
        <th>Name</th>
        <th>Points For</th>
        <th>DK Points</th>
        <th>Money Won</th>
    </tr>`;

    data.forEach(r=>{
        html += `<tr>
            <td>${r.Place}</td>
            <td>${r.Name}</td>
            <td>${r["Points For"]}</td>
            <td>${r["DK Points"]}</td>
            <td>$${r["Money Won"]}</td>
        </tr>`;
    });

    document.getElementById("seasonTable").innerHTML = html;
}

async function loadTournament(name){
    const res = await fetch(sheetURL(name));
    let data = await res.json();

    // Sort by DK Points descending
    data.sort((a,b)=>Number(b["DK Points"]) - Number(a["DK Points"]));

    let html = `<tr>
        <th>Name</th>
        <th>DK Points</th>
        <th>Place</th>
        <th>Points For</th>
    </tr>`;

    data.forEach(r=>{
        html += `<tr>
            <td>${r.Name}</td>
            <td>${r["DK Points"]}</td>
            <td>${r.Place}</td>
            <td>${r["Points For"]}</td>
        </tr>`;
    });

    document.getElementById("tournamentTable").innerHTML = html;
}

function buildDropdown(){
    const select = document.getElementById("tournamentSelect");

    events.forEach(e=>{
        const opt = document.createElement("option");
        opt.value = e;
        opt.textContent = e;
        select.appendChild(opt);
    });

    select.addEventListener("change",()=>{
        loadTournament(select.value);
    });

    loadTournament(events[0]);
}

loadSeasonStandings();
buildDropdown();
</script>

</body>
</html>
